# 生产部署示例：PostgreSQL（pgvector）+ 平台（API、实时通道、MCP、Web 工作台同一个容器）。
# 在本目录执行：
#   cp .env.example .env    # 填好数据库密码和签名密钥
#   docker compose up -d --build
# 然后打开 http://服务器:8080 注册第一个空间。对公网提供服务时请在前面加 HTTPS 反向代理，见 docs/deployment.md。
name: ainative

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    # 默认的 64 MB 共享内存在并行查询、建向量索引时可能不够（报 could not resize shared memory segment）。
    shm_size: 256mb
    environment:
      POSTGRES_DB: ainative
      POSTGRES_USER: ainative
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 里设置 POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # 数据库只在内部网络可见，不映射到宿主机。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ainative -d ainative"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
    image: ${APP_IMAGE:-ainative-platform:latest}
    restart: unless-stopped
    # 停止时应用最多用 30 秒收尾（把执行中的智能体和工作流标记好、释放领取的任务），Docker 默认只等 10 秒就强杀。
    stop_grace_period: 40s
    # 容器加固：根文件系统只读（临时文件写在内存里的 /tmp），去掉全部 Linux 能力，禁止提权。应用本身以非 root 用户运行。
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # 要连宿主机上的服务（例如 Ollama）时打开（Linux 需要，Docker Desktop 自带），见 docs/deployment.md。
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    # .env 里的其余配置（例如模型供应商 Ai__Providers__...）原样传给应用。
    env_file: .env
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=ainative;Username=ainative;Password=${POSTGRES_PASSWORD}
      Auth__SigningKey: ${Auth__SigningKey:?请在 .env 里设置 Auth__SigningKey（至少 32 个字符的随机字符串）}
      # 启动时自动执行数据库迁移（多个实例同时启动时排队执行，只会迁移一次）。
      Database__MigrateOnStartup: "true"
      # 信任反向代理传来的 X-Forwarded-For / X-Forwarded-Proto（容器只应经由反向代理访问）。
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"

volumes:
  postgres-data:
