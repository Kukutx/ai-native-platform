# 多实例部署示例：在 docker-compose.yml 的基础上把应用扩到多个副本，前面放 nginx 轮询分发。
# 实例之间通过 PostgreSQL 协调（实例登记、LISTEN/NOTIFY 广播），不需要 Redis，也不需要会话保持。
# 在本目录执行：
#   docker compose -f docker-compose.yml -f docker-compose.cluster.yml up -d --build
# 调整副本数：APP_REPLICAS=3（写进 .env，或在命令前设置）。说明见 docs/deployment.md。

services:
  app:
    # 多个副本不能都映射同一个宿主机端口，统一由 proxy 对外。
    ports: !reset []
    deploy:
      replicas: ${APP_REPLICAS:-2}

  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./nginx.cluster.conf:/etc/nginx/conf.d/default.conf:ro
