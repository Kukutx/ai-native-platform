# 多实例部署时容器内的负载均衡：轮询分发到 app 服务的所有副本。
# 对公网提供服务时，在它前面（或在这里）终止 HTTPS，见 docs/deployment.md。

# Docker 内置 DNS：副本增减或重建（升级）后 10 秒内生效，不用重启 nginx。
resolver 127.0.0.11 valid=10s ipv6=off;

upstream ainative {
    zone ainative 64k;
    # 同一个服务名写两行是有意的：只有一个 server 项时，nginx 不会把连不上的请求转给其他副本（实测某个副本宕机时请求直接失败）。
    server app:8080 resolve;
    server app:8080 resolve;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 访问日志只记路径不记查询串：实时通道（WebSocket）的登录令牌放在 ?access_token= 里，默认格式会把它写进日志。
log_format ainative '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';

server {
    listen 8080;
    access_log /var/log/nginx/access.log ainative;

    # 知识库上传文件最大 20 MB、CRM 导入文件最大 10 MB，再留出表单编码的余量
    client_max_body_size 25m;

    location / {
        proxy_pass http://ainative;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 智能体长时间执行时保持实时连接和流式回复
        proxy_read_timeout 1h;
        # 某个副本宕机或正在重启时，连不上就换一个副本（之后 10 秒内不再分给它）
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;
    }
}
