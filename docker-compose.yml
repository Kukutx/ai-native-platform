services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ainative-postgres
    environment:
      POSTGRES_DB: ainative
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ainative-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  ainative-postgres:
