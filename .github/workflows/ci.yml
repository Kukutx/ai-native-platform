name: CI

on:
  push:
    branches: [main]
  pull_request:

# 只读权限即可：CI 不推送、不评论，构建缓存走 Actions 运行时令牌，不需要额外授权。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # PR 有新提交时取消旧的运行；main 上每个提交都完整跑完，便于定位是哪次合并出的问题。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: 后端构建与测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      AINATIVE_TEST_POSTGRES: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      # 没有 packages.lock.json，按集中版本文件、项目文件和工具清单的内容做缓存键。
      - name: 缓存 NuGet 包
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props', '**/*.csproj', 'backend/.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: 构建
        run: dotnet build backend/AiNative.slnx -c Release
      - name: 检查实体模型是否都有迁移
        working-directory: backend
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project AiNative.Infrastructure --startup-project AiNative.Api --no-build --configuration Release
      # 复用上面的 Release 构建导出 OpenAPI，不再重新编译一遍 Debug。
      - name: 检查生成的 TS 客户端是否最新
        run: |
          node tools/generate-api-client.mjs --configuration Release --no-build
          git diff --exit-code -- packages/api-client
      - name: 测试
        run: >-
          dotnet test --solution backend/AiNative.slnx -c Release --no-build
          --report-xunit-trx --report-xunit-html --results-directory "${{ github.workspace }}/TestResults"
      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: 前端类型检查、lint 与构建
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm lint
      - name: 共享客户端单元测试
        run: pnpm test:client
      - name: 构建 Web（含静态导出）
        run: |
          pnpm --filter @ainative/web build
          pnpm --filter @ainative/web build:static
      - name: 打包移动端 JS（Android）
        run: pnpm --filter @ainative/mobile bundle:check
        env:
          EXPO_OFFLINE: 1

  desktop:
    name: 桌面端编译检查
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: 安装 WebKitGTK 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      # tauri::generate_context! 编译时要求 frontendDist（apps/web/out）存在。这里只检查 Rust 外壳能否编译，
      # 放一个占位页即可；真正的静态导出在 frontend 任务里构建和检查。
      - name: 准备占位的 Web 静态导出
        run: |
          mkdir -p apps/web/out
          echo '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>占位</title></head><body></body></html>' > apps/web/out/index.html
      - name: cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked

  image:
    name: 生产镜像构建与冒烟检查
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # 层缓存存进 GitHub Actions 缓存（mode=max 连同中间阶段一起缓存）；load 把镜像放回本机 docker，下面的冒烟检查直接用。
      - name: 构建镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ainative-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 开发密钥应被拒绝
        run: |
          if docker run --rm -e Auth__SigningKey=dev-only-signing-key-change-me-0123456789abcdef ainative-platform:ci; then
            echo "使用开发密钥时容器不应启动成功"; exit 1
          fi
      - name: 启动容器并检查页面与接口
        run: |
          docker run -d --name app --network host \
            -e ConnectionStrings__Postgres="Host=localhost;Port=5432;Database=ainative;Username=postgres;Password=postgres" \
            -e Auth__SigningKey="$(openssl rand -base64 48)" \
            -e Database__MigrateOnStartup=true \
            ainative-platform:ci
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/health/ready && break; sleep 2; done
          curl -fsS http://localhost:8080/health/ready
          curl -fsS http://localhost:8080/ | grep -q 'AI 原生工作台'
          curl -fsS -o /dev/null http://localhost:8080/analytics/explore
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/no-such-page)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/work-items)" = 401
      - name: 容器日志
        if: always()
        run: docker logs app || true
